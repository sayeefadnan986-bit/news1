
name: Collect RSS News

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "feeds.json"
      - "scripts/collect_feeds.py"
      - ".github/workflows/collect-news.yml"

permissions:
  contents: write

concurrency:
  group: pulse-news-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect latest news
        run: python scripts/collect_feeds.py

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes to news data."
          else
            git commit -m "Update collected news"
            git push origin HEAD:main
          fi
